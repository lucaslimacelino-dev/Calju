spring.application.name=calju-backend

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:calju}
spring.datasource.username=${POSTGRES_USER:calju}
spring.datasource.password=${POSTGRES_PASSWORD}

management.endpoints.web.exposure.include=health

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.mvc.problemdetails.enabled=true

calju.security.jwt-secret=${CALJU_JWT_SECRET:}
calju.security.jwt-issuer=calju
