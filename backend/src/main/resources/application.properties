spring.application.name=calju-backend

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:calju}
spring.datasource.username=${POSTGRES_USER:calju}
spring.datasource.password=${POSTGRES_PASSWORD}

management.endpoints.web.exposure.include=health
# O servidor de e-mail fora do ar não significa que a API está fora do ar.
management.health.mail.enabled=false

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.mvc.problemdetails.enabled=true

calju.security.jwt-secret=${CALJU_JWT_SECRET:}
calju.security.jwt-issuer=calju

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
calju.mail.from=${MAIL_FROM:CaLju <nao-responda@calju.local>}
