# Perfil de produção (SPRING_PROFILES_ACTIVE=prod, já definido na imagem Docker).
# Segredos e endereços vêm só de variáveis de ambiente; sem valor padrão, o servidor não sobe
# se faltar algum (melhor que subir com configuração de desenvolvimento).

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}

# Atrás de um proxy reverso com HTTPS: o IP real do cliente (usado na limitação de tentativas)
# vem do cabeçalho X-Forwarded-For, aceito só quando a conexão chega de um endereço de rede
# interna (padrão do Tomcat). Assim ninguém de fora forja o próprio IP.
server.forward-headers-strategy=native

# E-mail de verdade: SMTP com usuário, senha e TLS obrigatório.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
calju.mail.from=${MAIL_FROM}
